<section class="login-page">

  <div class="login-card">

    <!-- LOGO -->

    <div class="logo">
      Travel<span>Vista</span>
    </div>

    <p class="welcome">
      Welcome back! Explore the world with us.
    </p>


    <!-- LOGIN FORM -->

    <form>

      <div class="input-group">

        <label>Email Address</label>

        <input
          type="email"
          placeholder="Enter your email"
          required>

      </div>


      <div class="input-group">

        <label>Password</label>

        <input
          type="password"
          placeholder="Enter your password"
          required>

      </div>


      <div class="options">

        <label class="remember">
          <input type="checkbox">
          Remember me
        </label>

        <a href="#">Forgot Password?</a>

      </div>


      <button
        type="submit"
        class="login-btn">

        Login

      </button>

    </form>


    <!-- SIGNUP -->

    <p class="signup-text">

      Don't have an account?

      <a href="#">
        Create Account
      </a>

    </p>


    <!-- BACK HOME -->

    <a
      routerLink="/"
      class="back-home">

      ← Back to Home

    </a>

  </div>

</section>
